spring:
  datasource:
    # Base distinta por contexto de pruebas: DatosDemoTest usa otro contexto y no debe borrar la de los demás.
    url: jdbc:h2:mem:ugartino-${random.uuid};MODE=MSSQLServer;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop

app:
  datos-demo:
    habilitado: true
    dias-historial: 0   # las pruebas crean su propio historial
