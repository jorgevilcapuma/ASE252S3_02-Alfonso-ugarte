# =====================================================================
# Portal Ugartino Digital - SQL Server + creación del esquema + backend
#   Levantar:  docker compose up -d --build
#   Detener:   docker compose down          (agrega -v para borrar también los datos)
#   Swagger:   http://localhost:8080/swagger-ui.html
# =====================================================================
name: ugartino

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: ugartino-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${DB_PASSWORD:-Admin12345}
      TZ: America/Lima
    ports:
      - "${DB_PORT:-1434}:1433"          # 1434 en el host para no chocar con otro SQL Server local
    volumes:
      - ugartino_datos:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # Ejecuta database/init/*.sql (idempotentes) y termina.
  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: ${DB_PASSWORD:-Admin12345}
    volumes:
      - ./database/init:/scripts:ro
    entrypoint: ["/bin/bash", "-c", "for f in /scripts/*.sql; do echo \"Ejecutando $$f\"; /opt/mssql-tools18/bin/sqlcmd -C -b -I -S sqlserver -U sa -P \"$$MSSQL_SA_PASSWORD\" -i \"$$f\" || exit 1; done"]
    restart: "no"

  backend:
    build: .
    image: ugartino-backend:1.0
    container_name: ugartino-backend
    depends_on:
      db-init:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: jdbc:sqlserver://sqlserver:1433;databaseName=ugartino_db;encrypt=true;trustServerCertificate=true
      DATABASE_USERNAME: sa
      DATABASE_PASSWORD: ${DB_PASSWORD:-Admin12345}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:4200}
      TOKEN_SECRETO: ${TOKEN_SECRETO:-cambia-este-secreto-en-produccion-ugartino-2026}
      DATOS_DEMO: ${DATOS_DEMO:-true}
      TZ: America/Lima
    ports:
      - "${BE_PORT:-8080}:8080"
    restart: on-failure

volumes:
  ugartino_datos:
